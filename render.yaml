# Render Blueprint — New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: smarthive
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Vision/AI (YOLO) is not deployed, so the image fits the free tier.
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
    # NOTE: the free tier has no persistent disk, so the SQLite DB and any
    # saved detection images live on an ephemeral filesystem and reset on each
    # deploy/restart. To keep data, switch to a paid plan and add a disk:
    #   plan: standard
    #   disk:
    #     name: smarthive-data
    #     mountPath: /data
    #     sizeGB: 1
